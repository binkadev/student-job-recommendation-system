name: Core Smoke CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - "ai-service/**"
      - "scripts/smoke-core.ps1"
      - "scripts/run-recommendation-real-e2e.ps1"
      - "docker-compose.e2e.yml"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/core-smoke-ci.yml"

  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "ai-service/**"
      - "scripts/smoke-core.ps1"
      - "scripts/run-recommendation-real-e2e.ps1"
      - "docker-compose.e2e.yml"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/core-smoke-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker core acceptance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Backend-to-AI acceptance smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = & ./scripts/smoke-core.ps1 *>&1
          $smokeExitCode = $LASTEXITCODE

          $output | Tee-Object -FilePath smoke-output.log

          if ($smokeExitCode -ne 0) {
              throw "Smoke script failed with exit code $smokeExitCode."
          }

          if (-not (($output | ForEach-Object { [string]$_ }) -match "^Real Student Recommendation V3 E2E passed\.$")) {
              throw "Smoke script completed without the expected PASS marker."
          }

      - name: Show sanitized owned-stack diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem e2e/.local -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('diagnostics.json', 'cleanup.json') } |
            ForEach-Object { Get-Content -LiteralPath $_.FullName }

      # The smoke runner owns startup, partial-failure cleanup and volumes.
      # Never start/stop an unrelated default Compose project in this workflow.
