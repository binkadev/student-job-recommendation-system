name: Core Smoke CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "backend/**"
      - "ai-service/**"
      - "scripts/smoke-core.ps1"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/core-smoke-ci.yml"

  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "ai-service/**"
      - "scripts/smoke-core.ps1"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/core-smoke-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Docker core acceptance smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build and start core stack
        run: docker compose up --build -d

      - name: Show service status
        run: docker compose ps

      - name: Run Backend-to-AI acceptance smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = & ./scripts/smoke-core.ps1 `
            -TimeoutSeconds 240 `
            *>&1

          $output | Tee-Object -FilePath smoke-output.log

          if (-not (($output | ForEach-Object { [string]$_ }) -match "SMOKE RESULT: PASS")) {
              throw "Smoke script completed without the expected PASS marker."
          }

      - name: Show failure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 500

      - name: Clean up Docker resources
        if: always()
        run: docker compose down -v --remove-orphans