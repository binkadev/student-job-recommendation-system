name: Import README Assets from PR

on:
  pull_request:
    branches:
      - master
    paths:
      - '.readme-image-import/**'

permissions:
  contents: write

jobs:
  import-assets:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/fix-readme-images'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode and install assets
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import base64
          import gzip
          import pathlib
          import re

          chunk_dir = pathlib.Path('.readme-image-import')
          chunks = sorted(chunk_dir.glob('chunk-*.txt'))
          if not chunks:
              raise SystemExit('No chunks found')

          parts = [re.sub(rb'[^A-Za-z0-9+/=]', b'', path.read_bytes()) for path in chunks]
          for path, part in zip(chunks, parts):
              print(f'{path}: {len(part)} base64 characters')

          data = b''.join(parts)
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          prefix_len = sum(len(part) for part in parts[:-1])
          candidate_positions = [
              len(data),
              prefix_len,
              prefix_len + 17000,
              max(0, len(data) - 1),
          ]

          def decode_and_test(encoded: bytes):
              encoded = encoded.rstrip(b'=')
              encoded += b'=' * (-len(encoded) % 4)
              try:
                  raw = base64.b64decode(encoded, validate=True)
                  gzip.decompress(raw)
                  return raw
              except Exception:
                  return None

          raw = decode_and_test(data)
          if raw is None and len(data) % 4 == 3:
              for position in dict.fromkeys(candidate_positions):
                  for char in alphabet:
                      trial = data[:position] + bytes([char]) + data[position:]
                      raw = decode_and_test(trial)
                      if raw is not None:
                          print(f'Recovered one missing base64 character at position {position}: {chr(char)}')
                          break
                  if raw is not None:
                      break

          if raw is None:
              raise SystemExit('Unable to reconstruct valid gzip archive from chunks')

          pathlib.Path('/tmp/readme-import.gz').write_bytes(raw)
          PY

          extract_dir="$(mktemp -d)"
          tar -xzf /tmp/readme-import.gz -C "$extract_dir"

          readme_file="$(find "$extract_dir" -type f -name README.md | head -n 1)"
          test -n "$readme_file"
          cp "$readme_file" README.md

          mkdir -p docs/images/readme
          rm -f docs/images/readme/*.svg docs/images/readme/*.webp
          find "$extract_dir" -type f -name '*.webp' -exec cp '{}' docs/images/readme/ ';'

          image_count="$(find docs/images/readme -maxdepth 1 -type f -name '*.webp' | wc -l | tr -d ' ')"
          echo "Imported ${image_count} WebP images"
          test "$image_count" -ge 8
          test -f docs/images/readme/trang-chu.webp
          grep -q 'docs/images/readme/trang-chu.webp' README.md
          if grep -q '\.svg' README.md; then
            echo 'README still references SVG assets' >&2
            exit 1
          fi

          rm -rf .readme-image-import

      - name: Commit generated assets to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/images/readme .readme-image-import
          git diff --cached --check
          git commit -m 'docs: replace broken README images with optimized WebP assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
