name: AI Service CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-ci.yml"

  push:
    branches:
      - master
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test English AI service (Python 3.11.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ai-service

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: ai-service/requirements.lock

      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install locked dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements.lock

      - name: Validate dependency graph
        run: python -m pip check

      - name: Compile spaCy pipeline and bootstrap TF-IDF model
        run: |
          python -m offline.build_spacy_model \
            --output-dir built_models/spacy_custom_model
          python -m offline.train_tfidf_incremental \
            --bootstrap \
            --force-rebuild \
            --bootstrap-dir data/bootstrap_raw \
            --spacy-model-dir built_models/spacy_custom_model \
            --state-path built_models/tfidf/df_state.sqlite \
            --output-path built_models/tfidf/tfidf_model.pkl

      - name: Run AI tests
        run: python -m pytest
