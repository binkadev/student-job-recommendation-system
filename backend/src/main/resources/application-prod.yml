spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

  upload:
    cv:
      storage-dir: ${APP_CV_UPLOAD_DIR}
      max-file-size-bytes: ${APP_CV_MAX_FILE_SIZE_BYTES:10485760}

  ai-service:
    base-url: ${APP_AI_SERVICE_BASE_URL}
    connect-timeout: ${APP_AI_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${APP_AI_SERVICE_READ_TIMEOUT:15s}

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF